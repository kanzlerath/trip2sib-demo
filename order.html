<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Коробок — заказать еду | Trip2Sib</title>
  <link rel="stylesheet" href="./Коробок_files/fonts.css">
  <link rel="stylesheet" href="./order.css">
</head>
<body>
<div class="native-header" aria-label="Навигация Trip2Sib">
  <iframe src="./trip2sib-header.html" title="Trip2Sib" scrolling="no"></iframe>
</div>

<main class="order-page">
  <a class="back-link" href="./restaurant.html">← Назад к «Коробку»</a>
  <section class="order-top">
    <div class="order-top__main">
      <h1>Коробок</h1>
      <div class="order-top__meta">
        <span>до 24:00</span>
        <span>~35 мин</span>
      </div>
    </div>
    <div class="order-top__actions">
      <button class="mode active" data-mode="delivery">Доставка</button>
      <button class="mode" data-mode="pickup">Самовывоз</button>
    </div>
  </section>

  <div class="address-row">
    <span class="address-row__label">Адрес</span>
    <button class="address-row__value">Новосибирск, ул. Чаплыгина, 28</button>
  </div>

  <nav class="category-nav">
    <button class="active" data-cat="all">Все</button>
    <button data-cat="snacks">Закуски</button>
    <button data-cat="soups">Супы</button>
    <button data-cat="hot">Горячее</button>
    <button data-cat="desserts">Десерты</button>
    <button data-cat="drinks">Напитки</button>
  </nav>

  <div class="order-content">
    <section class="menu-section">
      <div class="menu-grid"></div>
    </section>

    <aside class="cart">
      <div class="cart__head">
        <h2>Корзина</h2>
        <span class="cart__count">0</span>
      </div>
      <div class="cart-items"></div>
      <div class="summary">
        <div><span>Сумма</span><strong class="subtotal">0 ₽</strong></div>
        <div class="total"><span>Итого</span><span class="total-value">0 ₽</span></div>
      </div>
      <button class="checkout" disabled>Оформить заказ</button>
    </aside>
  </div>
</main>

<div class="mobile-cart"><span>Корзина: <b class="mobile-count">0</b></span><strong class="mobile-total">0 ₽</strong><button>Открыть</button></div>
<div class="toast" role="status"></div>
<script src="./order.js"></script>
</body>
</html>
